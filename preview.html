<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aperçu des paires — Undercover Vidéo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0d12;
      color: #f5f5f7;
      padding: 20px;
    }
    header {
      max-width: 1400px;
      margin: 0 auto 20px;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    h1 {
      font-size: 1.5rem;
      background: linear-gradient(135deg, #ff3366, #6633ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      flex: 1;
      min-width: 240px;
    }
    .count {
      color: #9999a8;
      font-size: 0.9rem;
    }
    #search {
      flex: 1;
      min-width: 200px;
      background: #1a1a24;
      border: 1px solid #2a2a38;
      color: #f5f5f7;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    #search:focus { border-color: #ff3366; }

    .grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .card {
      background: #1a1a24;
      border: 1px solid #2a2a38;
      border-radius: 12px;
      padding: 12px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
      gap: 8px;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f5f5f7;
    }
    .card-id {
      font-family: monospace;
      font-size: 0.7rem;
      color: #555;
    }
    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .vid-cell {
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 9 / 16;
      position: relative;
    }
    .vid-cell video, .vid-cell img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .vid-cell.loading {
      background: #2a2a38 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><circle cx="20" cy="20" r="15" fill="none" stroke="%23ff3366" stroke-width="4" stroke-dasharray="20 80"/></svg>') no-repeat center;
    }
    .vid-title {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
      padding: 14px 8px 6px;
      font-size: 0.78rem;
      font-weight: 600;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>👁️ Aperçu des paires</h1>
    <span class="count" id="count">…</span>
    <input type="text" id="search" placeholder="🔎 Filtrer par nom ou id…" autocomplete="off">
  </header>

  <div class="grid" id="grid"></div>

  <script>
    let categories = [];
    let searchTerm = '';

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      let count = 0;
      categories.forEach(cat => {
        if (searchTerm) {
          const hay = (cat.id + ' ' + cat.name + ' ' + cat.videos.map(v => v.title).join(' ')).toLowerCase();
          if (!hay.includes(searchTerm)) return;
        }
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <div class="card-title">${cat.emoji} ${cat.name}</div>
            <div class="card-id">${cat.id}</div>
          </div>
          <div class="pair">
            ${cat.videos.map(v => `
              <div class="vid-cell loading" data-src="${v.url}">
                <div class="vid-title">${v.title}</div>
              </div>
            `).join('')}
          </div>
        `;
        grid.appendChild(card);
        count++;
      });
      document.getElementById('count').textContent = `${count} / ${categories.length} paires`;
      observeCells();
    }

    // Lazy load : on ne lit que les vidéos visibles à l'écran
    let observer;
    function observeCells() {
      if (observer) observer.disconnect();
      observer = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          const cell = entry.target;
          if (entry.isIntersecting && !cell.dataset.loaded) {
            const src = cell.dataset.src;
            const vid = document.createElement('video');
            vid.src = src;
            vid.autoplay = true;
            vid.loop = true;
            vid.muted = true;
            vid.playsInline = true;
            const title = cell.querySelector('.vid-title');
            cell.innerHTML = '';
            cell.appendChild(vid);
            if (title) cell.appendChild(title);
            cell.classList.remove('loading');
            cell.dataset.loaded = '1';
          } else if (!entry.isIntersecting && cell.dataset.loaded) {
            // Pause les vidéos qui sortent du viewport pour économiser CPU/batterie
            const v = cell.querySelector('video');
            if (v) v.pause();
          } else if (entry.isIntersecting && cell.dataset.loaded) {
            const v = cell.querySelector('video');
            if (v && v.paused) v.play().catch(() => {});
          }
        }
      }, { rootMargin: '200px' });
      document.querySelectorAll('.vid-cell').forEach(c => observer.observe(c));
    }

    async function init() {
      const r = await fetch('data/videos.json');
      const d = await r.json();
      categories = d.categories;
      render();

      let searchTimeout;
      document.getElementById('search').oninput = e => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          searchTerm = e.target.value.trim().toLowerCase();
          render();
        }, 150);
      };
    }

    init();
  </script>
</body>
</html>
